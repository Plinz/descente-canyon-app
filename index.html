<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal Documents - Descente Canyon App</title>
  <meta name="description" content="Public legal pages for Descente Canyon App.">
  <style>
    :root {
      --bg: #f5f2ea;
      --paper: #fffdf8;
      --text: #1f2933;
      --muted: #5b6874;
      --accent: #156f6a;
      --border: #e6dfd2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #efe8dc 0%, var(--bg) 100%);
      color: var(--text);
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #d9efeb;
      color: var(--accent);
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1.05;
    }
    .lead, nav a, .meta {
      font-family: Arial, sans-serif;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .card {
      margin-top: 24px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(31, 41, 51, 0.06);
    }
    p, li {
      font-size: 1.05rem;
      line-height: 1.7;
    }
    ul { margin: 0 0 14px 22px; }
    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    nav a {
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      background: #fff;
    }
    nav a:hover, .list a:hover {
      color: var(--accent);
    }
    .list a {
      color: var(--accent);
      text-decoration: none;
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }
    @media (max-width: 640px) {
      main { padding: 28px 14px 48px; }
      .card { padding: 20px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Descente Canyon App</div>
      <h1>Legal Documents</h1>
      <p class="lead">Public legal pages for Descente Canyon App.</p>
      <nav>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-and-conditions.html">Terms &amp; Conditions</a>
      </nav>
    </header>
    <article class="card">
      <p>This site hosts the public legal documents for Descente Canyon App.</p>
      <ul class="list">
        <li><a href="privacy-policy.html">Privacy Policy</a></li>
        <li><a href="terms-and-conditions.html">Terms &amp; Conditions</a></li>
      </ul>
      <p class="meta">Maintained for Google Play listing requirements.</p>
    </article>
  </main>
</body>
</html>
