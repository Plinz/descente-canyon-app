name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump to apply
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    env:
      RELEASE_KEYSTORE_FILE: release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          bump = os.environ["BUMP"]
          props = {}
          for line in Path("version.properties").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              props[key.strip()] = value.strip()

          current_name = props.get("VERSION_NAME", "1.0.0")
          current_code = int(props.get("VERSION_CODE", "1"))
          major, minor, patch = (int(part) for part in current_name.split("."))

          if bump == "major":
              next_version = (major + 1, 0, 0)
          elif bump == "minor":
              next_version = (major, minor + 1, 0)
          else:
              next_version = (major, minor, patch + 1)

          version_name = ".".join(str(part) for part in next_version)
          version_tag = f"v{version_name}"
          version_code = str(current_code + 1)

          print(f"current_version={current_name}")
          print(f"current_version_code={current_code}")
          print(f"version_name={version_name}")
          print(f"version_tag={version_tag}")
          print(f"version_code={version_code}")
          PY
        env:
          BUMP: ${{ github.event.inputs.bump }}

      - name: Show computed version
        run: |
          echo "Current version: ${{ steps.version.outputs.current_version }}"
          echo "Current version code: ${{ steps.version.outputs.current_version_code }}"
          echo "Next version: ${{ steps.version.outputs.version_name }}"
          echo "Version code: ${{ steps.version.outputs.version_code }}"

      - name: Ensure release tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.version_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.version_tag }} already exists"
            exit 1
          fi

      - name: Write version.properties
        run: |
          cat > version.properties <<EOF
          VERSION_CODE=${{ steps.version.outputs.version_code }}
          VERSION_NAME=${{ steps.version.outputs.version_name }}
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"

      - name: Build signed release bundle and APK
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease :app:verifyReleaseSizeBudget

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release size report
        uses: actions/upload-artifact@v7
        with:
          name: app-release-size-report-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/reports/release-size/release-package-report.txt
          if-no-files-found: error

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Bump app version to ${{ steps.version.outputs.version_name }}"
          git tag -a "${{ steps.version.outputs.version_tag }}" -m "Release ${{ steps.version.outputs.version_tag }}"
          git push origin HEAD:${{ github.ref_name }} "refs/tags/${{ steps.version.outputs.version_tag }}"

      - name: Wait for remote tag visibility
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          for _ in $(seq 1 10); do
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done

          echo "Tag $TAG is still not visible on origin after waiting"
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version_tag }}" \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            --title "${{ steps.version.outputs.version_tag }}" \
            --notes "Android release bundle and signed APK for version ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }})."

      - name: Write job summary
        run: |
          {
            echo "## Release artifacts ready"
            echo ""
            echo "- Previous version: `${{ steps.version.outputs.current_version }}`"
            echo "- Previous version code: `${{ steps.version.outputs.current_version_code }}`"
            echo "- New version: `${{ steps.version.outputs.version_name }}`"
            echo "- Version code: `${{ steps.version.outputs.version_code }}`"
            echo "- Git tag: `${{ steps.version.outputs.version_tag }}`"
            echo "- Play Store artifact: signed AAB"
            echo "- Test install artifact: signed APK"
            echo "- GitHub Release: `https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version_tag }}`"
          } >> "$GITHUB_STEP_SUMMARY"
